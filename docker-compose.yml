services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-dental_matching}
      MYSQL_USER: ${DB_USER:-dental_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      TZ: ${TZ:-America/Santiago}
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-dental_app}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
      DB_NAME: ${DB_NAME:-dental_matching}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Define JWT_REFRESH_SECRET}
      AI_AGENT_URL: http://ai-agent:8001
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  ai-agent:
    build: ./ai_agent
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8001
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
      TZ: ${TZ:-America/Santiago}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mysql_data:
