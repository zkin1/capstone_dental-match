services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-dental_matching}
      POSTGRES_USER: ${DB_USER:-dental_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      TZ: ${TZ:-America/Santiago}
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-dental_matching}
      DB_USER: ${DB_USER:-dental_app}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
      DB_SCHEMA: ${DB_SCHEMA:-dental_match}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Define JWT_REFRESH_SECRET}
      AI_AGENT_URL: http://ai-agent:8001
      AI_AGENT_TIMEOUT_MS: ${AI_AGENT_TIMEOUT_MS:-20000}
      AI_AGENT_TOKEN: ${AI_AGENT_TOKEN:?Define AI_AGENT_TOKEN}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  ai-agent:
    build: ./ai_agent
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8001
      LLM_ENABLED: "false"
      AI_AGENT_TOKEN: ${AI_AGENT_TOKEN:?Define AI_AGENT_TOKEN}
      TZ: ${TZ:-America/Santiago}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
